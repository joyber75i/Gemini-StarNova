<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini StarNova - Joyber Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: #1e1f20;
            border-bottom: 1px solid #2d2f31;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #a8c7fa;
        }

        .user-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #c4edd6;
            letter-spacing: 1px;
        }

        /* BOTONES DE APAGADO Y ENCENDIDO */
        .power-controls {
            display: flex;
            gap: 6px;
            background: #131314;
            padding: 4px;
            border-radius: 20px;
            border: 1px solid #444746;
        }

        .power-btn {
            border: none;
            padding: 6px 16px;
            border-radius: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
            color: #c4c7c5;
            background: transparent;
        }

        .power-btn.off-active {
            background: #8e2929;
            color: white;
        }

        .power-btn.on-active {
            background: #1e8e3e;
            color: white;
        }

        /* CONTENEDOR PRINCIPAL DIBUJADO EN PAINT */
        .main-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            padding: 16px;
            gap: 16px;
        }

        /* AREA CENTRAL DE PANTALLA DE LA PC VIRTUAL */
        .pc-screen {
            flex: 3;
            background-color: #1e1f20;
            border: 2px solid #444746;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            padding: 20px;
            text-align: center;
        }

        .star-icon {
            position: absolute;
            color: #a8c7fa;
            font-size: 1.5rem;
            opacity: 0.7;
        }

        /* Posiciones de las estrellas como en tu dibujo */
        .star-top-left { top: 15px; left: 20px; }
        .star-top-right { top: 15px; right: 20px; }
        .star-bottom-left { bottom: 15px; left: 20px; }
        .star-bottom-right { bottom: 15px; right: 20px; }

        .status-display {
            font-size: 1.4rem;
            font-weight: 500;
            color: #e3e3e3;
            margin-bottom: 10px;
        }

        .status-sub {
            color: #8e918f;
            font-size: 0.95rem;
            max-width: 80%;
        }

        /* COLUMNA DERECHA DE CHAT */
        .chat-sidebar {
            flex: 1;
            min-width: 280px;
            background-color: #1e1f20;
            border: 2px solid #444746;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .chat-header {
            font-weight: bold;
            font-size: 1.1rem;
            color: #a8c7fa;
            padding-bottom: 12px;
            border-bottom: 1px solid #333537;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 4px;
        }

        .msg {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            max-width: 90%;
            word-wrap: break-word;
        }

        .user-msg {
            background-color: #2b303b;
            color: #e3e3e3;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .ai-msg {
            background-color: #131314;
            color: #e3e3e3;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #a8c7fa;
        }

        /* CAMPO DE ENTRADA ESTILO GEMINI */
        .chat-input-box {
            display: flex;
            background: #131314;
            border: 1px solid #444746;
            border-radius: 28px;
            padding: 6px 12px;
            align-items: center;
        }

        .chat-input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            padding: 8px;
            font-size: 0.9rem;
        }

        .send-btn {
            background: #a8c7fa;
            border: none;
            color: #040c1e;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            ✨ <span>StarNova</span>
        </div>
        
        <div class="user-title">Joyber</div>

        <div class="power-controls">
            <button class="power-btn off-active" id="btnOFF" onclick="setPower(false)">OFF</button>
            <button class="power-btn" id="btnON" onclick="setPower(true)">ON</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- PANTALLA PRINCIPAL CON ESTRELLAS DEL DIBUJO -->
        <div class="pc-screen">
            <div class="star-icon star-top-left">✦</div>
            <div class="star-icon star-top-right">✦</div>
            <div class="star-icon star-bottom-left">✦</div>
            <div class="star-icon star-bottom-right">✦</div>

            <div class="status-display" id="screenStatus">PC Virtual Apagada 🔴</div>
            <div class="status-sub" id="screenSub">Presiona el botón ON arriba para encender tu PC virtual e iniciar los procesos de StarNova.</div>
        </div>

        <!-- COLUMNA DE CHAT DERECHA -->
        <div class="chat-sidebar">
            <div class="chat-header">
                <span>✦ Chat</span>
            </div>

            <div class="chat-messages" id="chatLogs">
                <div class="msg ai-msg">
                    ¡Hola Joyber! Estoy listo. Puedes encender o apagar la PC virtual arriba con los botones, o escribirte conmigo aquí mismo.
                </div>
            </div>

            <div class="chat-input-box">
                <input type="text" id="userInput" placeholder="Escribe a StarNova..." onkeypress="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()">➔</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "AQ.Ab8RN6JE9In75dH-yfxUC3V7dF1dprMbSO22mG8fB-JShwSicg";
        let isPcOn = false;

        function setPower(on) {
            isPcOn = on;
            const btnOFF = document.getElementById('btnOFF');
            const btnON = document.getElementById('btnON');
            const status = document.getElementById('screenStatus');
            const sub = document.getElementById('screenSub');

            if (on) {
                btnON.classList.add('on-active');
                btnOFF.classList.remove('off-active');
                status.innerText = "PC Virtual Encendida 🟢";
                sub.innerText = "Sistema StarNova v3.6 ejecutándose a Máxima Potencia. Listo para recibir procesos.";
                addMessage('ai', '🖥️ **StarNova Reporte:** La PC virtual se ha encendido correctamente. No hay tareas pesadas interrumpiéndose ahora.');
            } else {
                btnOFF.classList.add('off-active');
                btnON.classList.remove('on-active');
                status.innerText = "PC Virtual Apagada 🔴";
                sub.innerText = "Presiona el botón ON arriba para encender tu PC virtual e iniciar los procesos de StarNova.";
                addMessage('ai', '🛑 **StarNova Reporte:** Apagando entorno virtual. Si estaba procesando algo importante, guardé el estado actual.');
            }
        }

        function addMessage(role, text) {
            const logs = document.getElementById('chatLogs');
            const msg = document.createElement('div');
            msg.className = `msg ${role}-msg`;
            msg.innerText = text;
            logs.appendChild(msg);
            logs.scrollTop = logs.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            addMessage('user', text);
            input.value = '';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                const data = await response.json();
                if (data.candidates && data.candidates[0].content) {
                    const reply = data.candidates[0].content.parts[0].text;
                    addMessage('ai', reply);
                } else {
                    addMessage('ai', 'Recibido.');
                }
            } catch (e) {
                addMessage('ai', 'Error de conexión con la red de StarNova.');
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
